name: bookshelf
description: "Smart local PDF organizer and ebook reader with Netflix-style library UI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- UI & Styling ---
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  carousel_slider: ^4.2.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.0
  flutter_animate: ^4.5.0

  # --- PDF Core & Image Processing ---
  pdfx: ^2.6.0
  image: ^4.2.0
  path_provider: ^2.1.2

  # --- Local Storage & Database ---
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  shared_preferences: ^2.2.2

  # --- Networking & External Metadata APIs ---
  dio: ^5.4.2
  connectivity_plus: ^5.0.2

  # --- File System Access & Permissions ---
  file_picker: ^8.0.0
  permission_handler: ^11.3.1

  # --- Utilities & Architecture ---
  fpdart: ^1.1.0
  equatable: ^2.0.5
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  isar_generator: ^3.1.0+1

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.17

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
